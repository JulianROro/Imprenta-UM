<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Operativo · Imprenta UM</title>
<style>
  :root {
    --ink:     #0f1923;
    --paper:   #f5f2ec;
    --rule:    #ddd8cf;
    --lead:    #1d3557;
    --lead2:   #274978;
    --accent:  #c1440e;
    --gold:    #d4a017;
    --green:   #2a7a4b;
    --cyan:    #1a6f8c;
    --purple:  #5a4a8a;
    --sand:    #e8e2d6;
    --white:   #ffffff;

    /* stage colors */
    --s-abierta:    #8b6914;
    --s-diseno:     #1a6f8c;
    --s-planchas:   #7b3f7b;
    --s-preprensa:  #c1440e;
    --s-produccion: #1d5e30;
    --s-calidad:    #8b3a1a;
    --s-cerrada:    #2a7a4b;

    --card-w: 240px;
    --col-gap: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--lead);
    color: var(--white);
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
  .logo-mark {
    width: 40px; height: 40px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: bold; letter-spacing: -1px;
    color: #fff; border-radius: 2px;
    font-family: 'Georgia', serif;
    flex-shrink: 0;
  }
  .header-title { line-height: 1.15; }
  .header-title h1 { font-size: 15px; font-weight: normal; letter-spacing: 1.5px; text-transform: uppercase; }
  .header-title p  { font-size: 11px; color: #9fb4cd; letter-spacing: 0.5px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .last-update { font-size: 11px; color: #9fb4cd; font-family: 'Courier New', monospace; }
  .btn-form {
    font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase;
    background: var(--accent); color: #fff; border: none; border-radius: 2px;
    padding: 7px 14px; cursor: pointer; text-decoration: none; font-family: 'Georgia', serif;
    transition: background .2s;
  }
  .btn-form:hover { background: #a83a0c; }

  /* ── KPI BAR ── */
  .kpi-strip {
    background: var(--ink);
    padding: 0 28px;
    display: flex;
    align-items: stretch;
    gap: 0;
    border-bottom: 2px solid #2a3d52;
    overflow-x: auto;
  }
  .kpi-item {
    padding: 14px 24px;
    border-right: 1px solid #2a3d52;
    flex-shrink: 0;
    cursor: default;
  }
  .kpi-item:last-child { border-right: none; }
  .kpi-num {
    font-size: 26px; font-weight: bold; color: var(--white);
    font-family: 'Courier New', monospace; line-height: 1;
  }
  .kpi-label { font-size: 10px; color: #7a9ab8; letter-spacing: 0.8px; text-transform: uppercase; margin-top: 3px; }
  .kpi-item.accent .kpi-num  { color: var(--accent); }
  .kpi-item.gold   .kpi-num  { color: var(--gold); }
  .kpi-item.green  .kpi-num  { color: #5acc8a; }

  /* ── FILTERS ── */
  .filter-bar {
    background: var(--sand);
    border-bottom: 1px solid var(--rule);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .filter-bar label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .6px; flex-shrink: 0; }
  .filter-bar select, .filter-bar input {
    font-size: 12px; font-family: 'Georgia', serif;
    border: 1px solid var(--rule); background: var(--white);
    color: var(--ink); border-radius: 2px; padding: 5px 10px;
    outline: none;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--lead); }
  .btn-clear {
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    background: none; border: 1px solid #aaa; border-radius: 2px;
    padding: 5px 12px; cursor: pointer; color: #666; font-family: 'Georgia', serif;
    transition: all .2s;
  }
  .btn-clear:hover { background: var(--white); border-color: var(--lead); color: var(--lead); }
  .ot-count { font-size: 11px; color: #888; margin-left: auto; font-family: 'Courier New', monospace; }

  /* ── KANBAN BOARD ── */
  .board-wrap {
    padding: 20px 28px;
    overflow-x: auto;
    min-height: calc(100vh - 200px);
  }
  .board {
    display: flex;
    gap: var(--col-gap);
    min-width: max-content;
    align-items: flex-start;
  }

  /* ── STAGE COLUMN ── */
  .stage-col {
    width: var(--card-w);
    flex-shrink: 0;
  }
  .stage-header {
    padding: 8px 12px 7px;
    border-radius: 2px 2px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    position: relative;
  }
  .stage-header::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 0; right: 0;
    height: 2px;
    background: inherit;
    background-color: var(--stage-color, #888);
    opacity: .3;
  }
  .stage-name {
    font-size: 10px; font-weight: bold; letter-spacing: 1.2px;
    text-transform: uppercase; color: #fff;
    font-family: 'Courier New', monospace;
  }
  .stage-badge {
    background: rgba(255,255,255,.25);
    color: #fff;
    font-size: 11px; font-family: 'Courier New', monospace;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }

  .stage-abierta   .stage-header { background: var(--s-abierta); }
  .stage-diseno    .stage-header { background: var(--s-diseno); }
  .stage-planchas  .stage-header { background: var(--s-planchas); }
  .stage-preprensa .stage-header { background: var(--s-preprensa); }
  .stage-produccion .stage-header { background: var(--s-produccion); }
  .stage-calidad   .stage-header { background: var(--s-calidad); }
  .stage-cerrada   .stage-header { background: var(--s-cerrada); }

  .cards-zone {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 60px;
  }

  /* ── OT CARD ── */
  .ot-card {
    background: var(--white);
    border-radius: 2px;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--stage-color, #aaa);
    padding: 10px 11px;
    cursor: pointer;
    transition: box-shadow .15s, transform .12s;
    position: relative;
  }
  .ot-card:hover {
    box-shadow: 0 3px 14px rgba(0,0,0,.12);
    transform: translateY(-1px);
  }
  .card-id {
    font-family: 'Courier New', monospace;
    font-size: 9px; color: #888; letter-spacing: .5px;
    margin-bottom: 5px;
  }
  .card-nombre {
    font-size: 12px; line-height: 1.35; color: var(--ink);
    font-weight: bold;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .card-tipo {
    font-size: 10px; color: #666;
    background: var(--sand);
    display: inline-block;
    padding: 1px 6px; border-radius: 1px;
    margin-bottom: 6px;
  }
  .card-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; color: #777;
    border-top: 1px solid var(--rule);
    padding-top: 6px; margin-top: 2px;
  }
  .card-dep { 
    font-size: 9.5px; color: #888;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 130px;
  }
  .card-qty { font-family: 'Courier New', monospace; color: var(--lead2); font-size: 11px; }
  .card-date { font-family: 'Courier New', monospace; font-size: 9px; }
  .date-ok  { color: var(--green); }
  .date-risk { color: var(--accent); }
  .date-warn { color: var(--gold); }

  /* alert chips */
  .card-alerts { display: flex; gap: 4px; margin-bottom: 5px; flex-wrap: wrap; }
  .chip {
    font-size: 9px; border-radius: 1px;
    padding: 1px 5px; letter-spacing: .3px;
    font-family: 'Courier New', monospace;
    display: inline-block;
  }
  .chip-red    { background: #fde8e4; color: var(--accent); border: 1px solid #f4bdb4; }
  .chip-yellow { background: #fef7e0; color: #8a6800; border: 1px solid #f0d97a; }
  .chip-green  { background: #e4f4ea; color: var(--green); border: 1px solid #a8d8bc; }
  .chip-blue   { background: #e0eef5; color: var(--cyan); border: 1px solid #9ec8d8; }

  /* stage color stripes */
  .stage-abierta    .ot-card { border-left-color: var(--s-abierta); }
  .stage-diseno     .ot-card { border-left-color: var(--s-diseno); }
  .stage-planchas   .ot-card { border-left-color: var(--s-planchas); }
  .stage-preprensa  .ot-card { border-left-color: var(--s-preprensa); }
  .stage-produccion .ot-card { border-left-color: var(--s-produccion); }
  .stage-calidad    .ot-card { border-left-color: var(--s-calidad); }
  .stage-cerrada    .ot-card { border-left-color: var(--s-cerrada); }

  /* ── EMPTY COLUMN ── */
  .empty-lane {
    border: 2px dashed var(--rule);
    border-radius: 2px;
    padding: 18px 12px;
    text-align: center;
    color: #bbb;
    font-size: 11px;
    font-style: italic;
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15,25,35,.65);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--white);
    width: 100%; max-width: 680px;
    border-radius: 2px;
    border-top: 4px solid var(--lead);
    max-height: 90vh;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px;
  }
  .modal-head-left { flex: 1; }
  .modal-ot-id {
    font-family: 'Courier New', monospace;
    font-size: 11px; color: #888; margin-bottom: 4px;
  }
  .modal-title { font-size: 16px; line-height: 1.3; color: var(--lead); }
  .modal-close {
    background: none; border: none; cursor: pointer;
    font-size: 22px; color: #888; line-height: 1;
    padding: 0 4px; flex-shrink: 0;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-status-bar {
    padding: 8px 22px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--rule);
    background: var(--sand);
  }
  .status-pill {
    font-size: 11px; font-family: 'Courier New', monospace;
    padding: 3px 10px; border-radius: 20px; font-weight: bold;
    letter-spacing: .5px;
  }
  .modal-body {
    overflow-y: auto; padding: 18px 22px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .section-head {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
    color: #888; border-bottom: 1px solid var(--rule);
    padding-bottom: 4px; margin-bottom: 10px;
    font-family: 'Courier New', monospace;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 20px; }
  .field label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 2px; }
  .field span  { font-size: 13px; color: var(--ink); }
  .field span.mono { font-family: 'Courier New', monospace; }
  .obs-box {
    background: #fafaf7; border: 1px solid var(--rule);
    border-left: 3px solid var(--lead2);
    padding: 9px 12px; border-radius: 1px;
    font-size: 12px; line-height: 1.5; color: #444;
    font-style: italic;
  }
  .obs-box:empty::before { content: '—'; color: #bbb; font-style: normal; }

  /* ── FOOTER ── */
  footer {
    background: var(--lead);
    color: #7a9ab8;
    font-size: 10px;
    text-align: center;
    padding: 10px 28px;
    letter-spacing: .5px;
    font-family: 'Courier New', monospace;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--sand); }
  ::-webkit-scrollbar-thumb { background: #bbb; border-radius: 3px; }

  @media (max-width: 600px) {
    header { padding: 0 14px; }
    .kpi-strip { padding: 0 14px; }
    .filter-bar { padding: 10px 14px; }
    .board-wrap { padding: 14px; }
    .header-title h1 { font-size: 13px; }
  }
</style>
</head>

</div>

//  HELPERS
// ═══════════════════════════════════════════════════════
function parseDate(s) {
  if (!s) return null;
  const [d, m, y] = s.split('/');
  return new Date(+y, +m - 1, +d);
}
function today() { const t = new Date(); t.setHours(0,0,0,0); return t; }
function daysDiff(s) {
  const d = parseDate(s); if (!d) return null;
  return Math.ceil((d - today()) / 86400000);
}
function dateClass(s, closed) {
  if (closed) return 'date-ok';
  const diff = daysDiff(s);
  if (diff === null) return '';
  if (diff < 0) return 'date-risk';
  if (diff <= 5) return 'date-warn';
  return 'date-ok';
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getAlerts(ot) {
  const chips = [];
  const isClosed = ot.estado === 'Cerrada';
  if (!isClosed) {
    const diff = daysDiff(ot.fecha_requerida);
    if (diff !== null && diff < 0)       chips.push(['chip-red', '⚠ VENCIDA']);
    else if (diff !== null && diff <= 5) chips.push(['chip-yellow', `⏱ ${diff}d`]);
  }
  if (ot.requiere_compra === 'Sí' && !isClosed) chips.push(['chip-yellow', '🛒 Compra req.']);
  if (ot.planchas === 'No' && !isClosed && ['Preprensa','Producción','Calidad'].includes(ot.estado))
    chips.push(['chip-red', '🚫 Sin planchas']);
  if (ot.entrega_parcial && ot.entrega_parcial !== '0' && !isClosed)
    chips.push(['chip-blue', `📦 Parcial: ${ot.entrega_parcial}`]);
  if (isClosed && ot.sla === 'Sí') chips.push(['chip-green', '✓ SLA OK']);
  return chips;
}

function depShort(dep) {
  const map = {
    'Rectoría - Comunicaciones y Mercadeo': 'Rectoría · Com&Mkt',
    'Rectoría - Alta consejería': 'Rectoría · Alta Cons.',
    'Vicerrectoria': 'Vicerrectoría',
    'Vicerrectoría - Biblioteca': 'Bibl. Unimetro',
    'Vicerrectoria - Direccion Administrativa': 'Dir. Administrativa',
  };
  return map[dep] || dep;
}

let filtered = [...OTS];

function renderKPIs() {
  const total   = OTS.length;
  const cerradas = OTS.filter(o => o.estado === 'Cerrada').length;
  const enCurso  = total - cerradas;
  const slaOk    = OTS.filter(o => o.sla === 'Sí').length;
  const vencidas = OTS.filter(o => o.estado !== 'Cerrada' && daysDiff(o.fecha_requerida) !== null && daysDiff(o.fecha_requerida) < 0).length;
  const totalUnits = OTS.reduce((a,o)=>a+(parseInt(o.cantidad)||0),0);

  document.getElementById('kpiStrip').innerHTML = `
    <div class="kpi-item"><div class="kpi-num">${total}</div><div class="kpi-label">OTs Totales</div></div>
    <div class="kpi-item"><div class="kpi-num">${enCurso}</div><div class="kpi-label">En Curso</div></div>
    <div class="kpi-item green"><div class="kpi-num">${cerradas}</div><div class="kpi-label">Cerradas</div></div>
    <div class="kpi-item gold"><div class="kpi-num">${slaOk}</div><div class="kpi-label">SLA Cumplido</div></div>
    <div class="kpi-item accent"><div class="kpi-num">${vencidas}</div><div class="kpi-label">Vencidas</div></div>
    <div class="kpi-item"><div class="kpi-num">${totalUnits.toLocaleString('es')}</div><div class="kpi-label">Unidades solicitadas</div></div>
  `;
}

function renderFilters() {
  const deps = [...new Set(OTS.map(o=>o.dependencia))].sort();
  const states = [...new Set(OTS.map(o=>o.estado))];
  const depSel = document.getElementById('fDep');
  const estSel = document.getElementById('fEstado');
  deps.forEach(d => { const opt = document.createElement('option'); opt.value=d; opt.textContent=d; depSel.appendChild(opt); });
  states.forEach(s => { const opt = document.createElement('option'); opt.value=s; opt.textContent=s; estSel.appendChild(opt); });
}

function applyFilters() {
  const dep    = document.getElementById('fDep').value;
  const estado = document.getElementById('fEstado').value;
  const q      = document.getElementById('fSearch').value.toLowerCase().trim();
  filtered = OTS.filter(o => {
    if (dep   && o.dependencia !== dep)    return false;
    if (estado && o.estado !== estado)     return false;
    if (q && ![o.id, o.nombre, o.solicitante, o.tipo].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  renderBoard();
}

function clearFilters() {
  document.getElementById('fDep').value = '';
  document.getElementById('fEstado').value = '';
  document.getElementById('fSearch').value = '';
  applyFilters();
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  STAGES.forEach(stage => {
    const ots = filtered.filter(o => o.estado === stage.key);

    const col = document.createElement('div');
    col.className = `stage-col ${stage.cls}`;
    col.innerHTML = `
      <div class="stage-header">
        <span class="stage-name">${stage.label}</span>
        <span class="stage-badge">${ots.length}</span>
      </div>
      <div class="cards-zone" id="zone-${stage.key.replace(/\s/g,'-')}">
        ${ots.length === 0 ? '<div class="empty-lane">Sin OTs en este stage</div>' : ''}
      </div>`;
    board.appendChild(col);

    const zone = col.querySelector('.cards-zone');
    ots.forEach(ot => {
      const alerts = getAlerts(ot);
      const dCls   = dateClass(ot.fecha_requerida, ot.estado === 'Cerrada');
      const card   = document.createElement('div');
      card.className = 'ot-card';
      card.innerHTML = `
        <div class="card-id">${esc(ot.id)}</div>
        ${alerts.length ? `<div class="card-alerts">${alerts.map(([cls,lbl])=>`<span class="chip ${cls}">${lbl}</span>`).join('')}</div>` : ''}
        <div class="card-nombre">${esc(ot.nombre)}</div>
        <div class="card-tipo">${esc(ot.tipo)}</div>
        <div class="card-meta">
          <span class="card-dep">${depShort(ot.dependencia)}</span>
          <span class="card-qty">${ot.cantidad}</span>
        </div>
        <div class="card-meta" style="margin-top:5px;">
          <span style="font-size:9px;color:#aaa;">Entrega:</span>
          <span class="card-date ${dCls}">${ot.fecha_requerida || '—'}</span>
        </div>`;
      card.onclick = () => openModal(ot);
      zone.appendChild(card);
    });
  });

  document.getElementById('otCount').textContent = `${filtered.length} de ${OTS.length} OTs`;
}

      <div class="section-head">A · Información de Solicitud</div>
      <div class="grid2">
        <div class="field"><label>Fecha solicitud</label><span class="mono">${ot.fecha_solicitud}</span></div>
        <div class="field"><label>Fecha requerida</label><span class="mono ${dateClass(ot.fecha_requerida, ot.estado==='Cerrada')}">${ot.fecha_requerida || '—'}</span></div>
        <div class="field"><label>Solicitante</label><span>${ot.solicitante}</span></div>
        <div class="field"><label>Correo</label><span style="font-size:11px;">${ot.correo}</span></div>
        <div class="field"><label>Cantidad</label><span class="mono">${ot.cantidad}</span></div>
        <div class="field"><label>Prioridad</label><span>${ot.prioridad}</span></div>
        <div class="field"><label>Responsable OT</label><span>${ot.responsable}</span></div>
      </div>
    </div>

    <!-- DISEÑO -->
    <div>
      <div class="section-head">B · Diseño</div>
      <div class="grid3">
        <div class="field"><label>Versión</label><span>${ot.version_diseno || '—'}</span></div>
        <div class="field"><label>Cliente aprobó</label><span>${ot.cliente_aprobo || '—'}</span></div>
        <div class="field"><label>Fecha aprobación</label><span class="mono">${ot.fecha_aprobacion || '—'}</span></div>
      </div>
      <div class="obs-box" style="margin-top:10px;">${esc(ot.obs_diseno)}</div>
    </div>

    <!-- PREPRENSA -->
    <div>
      <div class="section-head">C · Preprensa & Especificación Técnica</div>
      <div class="grid3">
        <div class="field"><label>Planchas listas</label><span>${ot.planchas || '—'}</span></div>
        <div class="field"><label>Formato (cm)</label><span>${ot.formato || '—'}</span></div>
        <div class="field"><label>Color / Tintas</label><span>${ot.color || '—'}</span></div>
        <div class="field"><label>Material</label><span>${ot.material || '—'}</span></div>
        <div class="field"><label>Acabado</label><span>${ot.acabado || '—'}</span></div>
        <div class="field"><label>Máquina</label><span>${ot.maquina || '—'}</span></div>
      </div>
    </div>

    <!-- PRODUCCIÓN -->
    <div>
      <div class="section-head">D · Producción</div>
      <div class="grid3">
        <div class="field"><label>Hay stock</label><span>${ot.hay_stock || '—'}</span></div>
        <div class="field"><label>Requiere compra</label><span>${ot.requiere_compra || '—'}</span></div>
        <div class="field"><label>Inicio producción</label><span class="mono">${ot.fecha_inicio_prod || '—'}</span></div>
        <div class="field"><label>Fin producción</label><span class="mono">${ot.fecha_fin_prod || '—'}</span></div>
        <div class="field"><label>Cant. producida</label><span class="mono">${ot.cant_producida || '—'}</span></div>
        <div class="field"><label>Entrega parcial</label><span class="mono">${ot.entrega_parcial || '—'}</span></div>
      </div>
    </div>

    <!-- CALIDAD Y CIERRE -->
    <div>
      <div class="section-head">E · Calidad & Cierre</div>
      <div class="grid3">
        <div class="field"><label>Control calidad OK</label><span>${ot.calidad_ok || '—'}</span></div>
        <div class="field"><label>Fecha entrega</label><span class="mono">${ot.fecha_entrega || '—'}</span></div>
        <div class="field"><label>Recibido por</label><span>${ot.recibido_por || '—'}</span></div>
        <div class="field"><label>Fecha cierre</label><span class="mono">${ot.fecha_cierre || '—'}</span></div>
        <div class="field"><label>Tiempo ciclo</label><span class="mono">${ot.tiempo_ciclo ? ot.tiempo_ciclo + ' días' : '—'}</span></div>
        <div class="field"><label>SLA cumplido</label><span>${ot.sla || '—'}</span></div>
      </div>
      ${ot.obs_calidad ? `<div class="obs-box" style="margin-top:10px;">${esc(ot.obs_calidad)}</div>` : ''}
      ${ot.obs_cierre  ? `<div class="obs-box" style="margin-top:8px;">${esc(ot.obs_cierre)}</div>`  : ''}
    </div>
  `;

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
function init() {
  // Last update timestamp
  const now = new Date();
  document.getElementById('lastUpdate').textContent =
    `Act. ${now.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})} ${now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`;

  renderKPIs();
  renderFilters();
  applyFilters();

  document.getElementById('fDep').addEventListener('change', applyFilters);
  document.getElementById('fEstado').addEventListener('change', applyFilters);
  document.getElementById('fSearch').addEventListener('input', applyFilters);
}

init();
</script>
</body>
</html>
